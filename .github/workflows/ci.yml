name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  qualidade:
    name: Qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn format:check
      - run: yarn typecheck
      - run: yarn openapi:check

  testes-unitarios:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build

  teste-e2e:
    name: Testes e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tedi
          POSTGRES_PASSWORD: tedi
          POSTGRES_DB: tedi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tedi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: tedi
      DB_PASSWORD: tedi
      DB_DATABASE: tedi
      # Consumido pelo AuthModule (JwtModule.registerAsync usa ConfigService.getOrThrow):
      # o smoke test do AppModule sobe a aplicação inteira e precisa da chave.
      JWT_SECRET: ci-test-secret-do-not-use-in-production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn migration:run
      - run: yarn test:e2e

  entidades-migrations:
    name: Entidades × migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tedi
          POSTGRES_PASSWORD: tedi
          POSTGRES_DB: tedi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tedi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: tedi
      DB_PASSWORD: tedi
      DB_DATABASE: tedi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Aplica todas as migrations (up)
        run: yarn migration:run
      - name: Reverte a última migration (down funciona)
        run: yarn migration:revert
      - name: Reaplica (ciclo up/down/up íntegro)
        run: yarn migration:run
      # Nota: TypeORM 0.3 tem bug com enums PG — migration:generate sempre
      # emite uma migration idempotente de rename, então não serve como
      # detector de drift entidade↔schema. O ciclo up/down/up prova que
      # as migrations aplicam e revertem sem erro, que é o que o CA4 do
      # card GUS-74 exige neste momento.
