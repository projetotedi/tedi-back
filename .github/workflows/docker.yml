name: Docker

# Só confere que a imagem de produção continua construindo. Roda em push para main
# (e manualmente), não em PR: em PR a imagem não é usada por ninguém e gasta minutos da cota.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - yarn.lock
      - src/**
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t tedi-back:${{ github.ref_name }} .
